amcl:
  ros__parameters:
    use_map_topic: true
    scan_topic: scan
    odom_model_type: diff_corrected
    odom_alpha: [0.1, 0.1, 0.1, 0.1, 0.2, 0.2]
    transform_tolerance: 0.5

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "dwb_core::DWBFollowPath"
      debug_trajectory_analyses: false
      control_plugin_ids: [FollowPath]
      FollowPath:
        plugin: "nav2_rotation_rotation_controller::RotationController"

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.125
      downsample_costmap: 2
      allow_unknown: true

bt_navigator:
  ros__parameters:
    bt_xml_filename: /config/bt_navigator.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_sourcebt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_tree_root_bt_node

velocity_smoother:
  ros__parameters:
    scale_plugins: true
    odom_topic: /ghostpilot/odometry
    odom_duration: 0.5
    max_velocity: [1.0, 0.5, 2.0]
    min_velocity: [0.0, 0.0, 0.0]

costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
      inflation_layer:
        enabled: true
        cost_scaling_factor: 1.0
        inflation_radius: 0.5
      static_layer:
        enabled: true
        map_topic: /map

  local_costmap:
    ros__parameters:
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
      inflation_layer:
        enabled: true
        cost_scaling_factor: 1.0
        inflation_radius: 0.3